name: LCL IronTerm Preview

on:
  push:
    branches:
      - feat/lcl-ironterm-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lcl-ironterm-preview
          fetch-depth: 0

      - name: Replace mock LCL terminal with real sign-on layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          preview = '''        <article class="flagship reveal">
          <div class="flagship-visual">
            <a class="lcl-ironterm-preview" href="https://github.com/jtflack-grc/legacy-control-lab" target="_blank" rel="noreferrer" aria-label="Open Legacy Control Lab on GitHub">
              <div class="lcl-ironterm-bar">
                <span><b class="lcl-connected">●</b> IRONTERM / TN5250E</span>
                <span>CLAIMS400</span>
              </div>
              <div class="lcl-5250-stage" aria-hidden="true">
                <div class="lcl-5250-screen">
                  <span class="lcl-5250-item lcl-5250-hi" style="--row:1;--col:36;--span:7">Sign On</span>
                  <span class="lcl-5250-item" style="--row:2;--col:42;--span:27">System  . . . . . . . . . :</span>
                  <span class="lcl-5250-item" style="--row:2;--col:71;--span:10">CLAIMS400</span>
                  <span class="lcl-5250-item" style="--row:3;--col:42;--span:27">Subsystem . . . . . . . . :</span>
                  <span class="lcl-5250-item" style="--row:3;--col:71;--span:10">QINTER</span>
                  <span class="lcl-5250-item" style="--row:4;--col:42;--span:27">Display . . . . . . . . . :</span>
                  <span class="lcl-5250-item" style="--row:4;--col:71;--span:10">QPADEV0001</span>
                  <span class="lcl-5250-item" style="--row:6;--col:17;--span:34">User  . . . . . . . . . . . . . .</span>
                  <span class="lcl-5250-item" style="--row:7;--col:17;--span:34">Password  . . . . . . . . . . . .</span>
                  <span class="lcl-5250-item" style="--row:10;--col:17;--span:34">Program/procedure . . . . . . . .</span>
                  <span class="lcl-5250-item" style="--row:11;--col:17;--span:34">Menu  . . . . . . . . . . . . . .</span>
                  <span class="lcl-5250-item" style="--row:12;--col:17;--span:34">Current library . . . . . . . . .</span>
                  <span class="lcl-5250-item lcl-5250-hi" style="--row:24;--col:43;--span:38">(C) COPYRIGHT LCL IONGRC. 1974, 2026.</span>
                  <span class="lcl-5250-cursor" style="--row:6;--col:53" title="5250 cursor"></span>
                </div>
              </div>
              <div class="lcl-oia" aria-hidden="true">
                <span class="lcl-oia-conn">●</span><span class="lcl-oia-sys">SYS</span><span>▢</span><span>·</span><span>·</span><span>·</span><span class="lcl-oia-spacer"></span><span>TN5250E</span><span class="lcl-oia-cursor">06,53</span>
              </div>
            </a>
          </div>
          <div class="flagship-copy">'''

          pattern = re.compile(
              r'        <article class="flagship reveal">\n'
              r'          <div class="flagship-visual">.*?'
              r'          <div class="flagship-copy">',
              re.S,
          )
          if not pattern.search(text):
              raise SystemExit('Could not locate Legacy Control Lab flagship visual')
          text = pattern.sub(preview, text, count=1)

          css = '''
      .lcl-ironterm-preview {
        width: 82%;
        max-width: 560px;
        aspect-ratio: 4 / 3;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #1f3a1f;
        background: #000;
        color: #33ff33;
        text-decoration: none;
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.34);
        transition: border-color 0.18s ease;
      }
      .lcl-ironterm-preview:hover,
      .lcl-ironterm-preview:focus-visible {
        border-color: #34c759;
      }
      .lcl-ironterm-preview:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 4px;
      }
      .lcl-ironterm-bar {
        min-height: 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0 10px;
        border-bottom: 1px solid #1a2e1a;
        background: #050805;
        color: #718b75;
        font: 500 0.58rem "IBM Plex Mono", monospace;
        letter-spacing: 0.08em;
      }
      .lcl-connected,
      .lcl-oia-conn,
      .lcl-oia-sys {
        color: #5cf65c;
      }
      .lcl-5250-stage {
        flex: 1 1 auto;
        min-height: 0;
        padding: 5px 7px 3px;
        background: #000;
      }
      .lcl-5250-screen {
        height: 100%;
        display: grid;
        grid-template-columns: repeat(80, minmax(0, 1fr));
        grid-template-rows: repeat(24, minmax(0, 1fr));
        overflow: hidden;
        color: #33ff33;
        background: #000;
        font-family: "IBM Plex Mono", monospace;
        font-size: clamp(7px, 0.72vw, 10px);
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0;
        text-shadow: 0 0 5px rgba(51, 255, 51, 0.13);
        user-select: none;
      }
      .lcl-5250-item {
        grid-row: var(--row);
        grid-column: var(--col) / span var(--span);
        align-self: center;
        white-space: pre;
        overflow: visible;
      }
      .lcl-5250-hi {
        color: #fff;
        text-shadow: none;
      }
      .lcl-5250-cursor {
        grid-row: var(--row);
        grid-column: var(--col);
        align-self: end;
        width: 100%;
        height: 4px;
        margin-bottom: 1px;
        background: rgba(255, 255, 255, 0.62);
        animation: lcl-cursor-blink 1s steps(1, end) infinite;
      }
      .lcl-oia {
        min-height: 24px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 2px 8px;
        border-top: 1px solid #1f3a1f;
        background: #0a0a0a;
        color: #777;
        font: 500 0.62rem "IBM Plex Mono", monospace;
        user-select: none;
      }
      .lcl-oia-spacer {
        flex: 1 1 auto;
      }
      .lcl-oia-cursor {
        color: #6cf;
      }
      @keyframes lcl-cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .lcl-5250-cursor { animation: none; }
      }
'''

          marker = '      @media (max-width: 900px) {'
          if '.lcl-ironterm-preview {' not in text:
              if marker not in text:
                  raise SystemExit('Could not locate inline portfolio style marker')
              text = text.replace(marker, css + marker, 1)

          path.write_text(text)
          PY

      - name: Verify portfolio preview
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          assert 'IRONTERM / TN5250E' in text
          assert '(C) COPYRIGHT LCL IONGRC. 1974, 2026.' in text
          assert 'lcl-5250-cursor' in text
          assert 'Can You Prove IBM i Security?' not in text
          assert text.count('class="flagship reveal"') == 1
          assert text.index('<h3>Legacy Control Lab</h3>') < text.index('<h3>IMPACT!</h3>')
          PY

      - name: Commit preview
        run: |
          if git diff --quiet -- index.html; then
            echo "No preview changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show the real LCL sign-on screen in the portfolio"
          git push origin HEAD:feat/lcl-ironterm-preview
