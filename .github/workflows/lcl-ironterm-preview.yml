name: LCL Preview

on:
  push:
    branches:
      - feat/lcl-ironterm-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lcl-ironterm-preview
          fetch-depth: 0
      - run: python tools/lcl_preview_patch.py
      - run: |
          if git diff --quiet -- index.html; then
            echo "No preview changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show the real LCL sign-on screen in the portfolio"
          git push origin HEAD:feat/lcl-ironterm-preview
