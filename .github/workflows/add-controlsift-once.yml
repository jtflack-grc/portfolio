name: Add ControlSift to portfolio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-controlsift-once.yml

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Feature ControlSift and refresh selected systems
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          if 'id="controlsift-project"' in text:
              raise SystemExit("ControlSift is already featured; refusing to duplicate it.")

          replacements = {
              "I build practical systems that connect technical evidence to accountable decisions—across legacy infrastructure, cyber risk, operational resilience, and emerging AI governance.":
                  "I build practical systems that connect technical evidence to accountable decisions—across legacy infrastructure, cyber risk, operational resilience, and AI assurance and governance.",
              '<p><span>04</span> Emerging AI governance</p>':
                  '<p><span>04</span> AI assurance &amp; governance</p>',
              '<span>OSCAL</span><i></i><span>AI Governance</span>':
                  '<span>OSCAL</span><i></i><span>AI Assurance</span>',
              "Each project starts with a governance problem and ends with something usable: a lab, an evidence runtime, a work queue, a decision model, a control pipeline, or an accountable intervention.":
                  "Each project starts with a governance problem and ends with something usable: a lab, an evidence runtime, a work queue, a decision model, a control pipeline, a research artifact, or an accountable intervention.",
              '<div class="card-top"><span>03</span><span>IBM i REMEDIATION CURATOR</span></div>':
                  '<div class="card-top"><span>04</span><span>IBM i REMEDIATION CURATOR</span></div>',
              '<div class="card-top"><span>04</span><span>CYBER-LOSS CASEBOOK</span></div>':
                  '<div class="card-top"><span>05</span><span>CYBER-LOSS CASEBOOK</span></div>',
              '<div class="card-top"><span>05</span><span>CONTROL PIPELINE</span></div>':
                  '<div class="card-top"><span>06</span><span>CONTROL PIPELINE</span></div>',
              '<div class="card-top"><span>06</span><span>LIVE DECISION TOOL</span></div>':
                  '<div class="card-top"><span>07</span><span>LIVE DECISION TOOL</span></div>',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected portfolio text not found: {old[:90]}")
              text = text.replace(old, new, 1)

          controlsift_card = '''

          <article class="project-card reveal" id="controlsift-project">
            <div class="card-top"><span>03</span><span>AI ASSURANCE RESEARCH</span></div>
            <h3>ControlSift</h3>
            <p class="project-tagline">Can a small AI model tell proof from paperwork?</p>
            <p>Applied AI assurance research testing small-model approaches to cybersecurity control-evidence classification with a hardened synthetic benchmark, classical baselines, Gemma prompting, QLoRA, failure analysis, and explicit research-governance controls.</p>
            <div class="project-proof">
              <p><strong>Problem</strong> Relevant documentation can look convincing without proving a control operated, and an AI experiment can look convincing without justifying the claim made from it.</p>
              <p><strong>Built</strong> A reproducible research stack spanning benchmark generation and leakage hardening, classical baselines, zero- and few-shot Gemma, QLoRA, strict parsing, Failure Lab analysis, Data and Model Cards, a risk register, and a sealed protocol.</p>
              <p><strong>Inspect</strong> Public research hub · experiment ledger · report · narrated presentation · release artifacts · source.</p>
            </div>
            <p class="provenance">Developed through Google DeepMind AI Research Foundations via Mentor Me Collective. Within the controlled Gemma v1.0 experiments, few-shot prompting was strongest and QLoRA did not outperform it; the negative result and version boundary are preserved rather than turned into an artificial AI win.</p>
            <ul class="tags"><li>AI assurance</li><li>Model evaluation</li><li>Control evidence</li><li>Responsible AI</li></ul>
            <div class="repo-list">
              <a href="https://jtflack-grc.github.io/controlsift/" target="_blank" rel="noreferrer"><span>Explore ControlSift</span><b>↗</b></a>
              <a href="https://github.com/jtflack-grc/controlsift" target="_blank" rel="noreferrer"><span>Inspect the source</span><b>↗</b></a>
            </div>
          </article>'''

          changeproof_pattern = re.compile(
              r'(<article class="project-card reveal" id="changeproof-project">.*?</article>)',
              re.S,
          )
          text, n = changeproof_pattern.subn(r'\1' + controlsift_card, text, count=1)
          if n != 1:
              raise SystemExit(f"Expected one ChangeProof card; found {n}.")

          fairness_pattern = re.compile(
              r'\n\s*<article class="project-card reveal">\s*'
              r'<div class="card-top"><span>07</span><span>AI GOVERNANCE / APPLIED FAIRNESS</span></div>.*?'
              r'<h3>AI Fairness Governance Toolkit</h3>.*?</article>\n',
              re.S,
          )
          text, n = fairness_pattern.subn('\n', text, count=1)
          if n != 1:
              raise SystemExit(f"Expected one featured AI Fairness card; found {n}.")

          archive_anchor = '              <a href="https://github.com/jtflack-grc?tab=repositories" target="_blank" rel="noreferrer"><span>All repositories</span><b>↗</b></a>'
          archive_link = '              <a href="https://github.com/jtflack-grc/ai-fairness-governance-toolkit" target="_blank" rel="noreferrer"><span>AI Fairness Governance Toolkit</span><b>↗</b></a>\n'
          if archive_anchor not in text:
              raise SystemExit("Could not find archive insertion point.")
          text = text.replace(archive_anchor, archive_link + archive_anchor, 1)

          required = [
              '<span>02</span><span>CHANGE ASSURANCE RUNTIME</span>',
              '<span>03</span><span>AI ASSURANCE RESEARCH</span>',
              '<span>04</span><span>IBM i REMEDIATION CURATOR</span>',
              '<span>05</span><span>CYBER-LOSS CASEBOOK</span>',
              '<span>06</span><span>CONTROL PIPELINE</span>',
              '<span>07</span><span>LIVE DECISION TOOL</span>',
          ]
          positions = []
          for marker in required:
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit(f"Missing expected ordering marker: {marker}")
              positions.append(pos)
          if positions != sorted(positions):
              raise SystemExit("Selected-system ordering is not 02–07 as intended.")
          if text.count('id="controlsift-project"') != 1:
              raise SystemExit("ControlSift card count is not exactly one.")
          if '<h3>AI Fairness Governance Toolkit</h3>' in text:
              raise SystemExit("AI Fairness Toolkit still appears as a featured card.")
          if text.count('>AI Fairness Governance Toolkit</span>') != 1:
              raise SystemExit("AI Fairness Toolkit archive link is missing or duplicated.")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit portfolio update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Feature ControlSift in selected systems"
          git push
