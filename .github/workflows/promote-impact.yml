name: Promote Impact

on:
  push:
    branches:
      - feat/promote-impact
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/promote-impact
          fetch-depth: 0

      - name: Promote IMPACT in portfolio
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          grid_start = text.index('        <div class="project-grid">')
          lab_start = text.index('          <article class="project-card lab-card lab-archive reveal">', grid_start)
          prefix = text[:grid_start]
          grid_head = '        <div class="project-grid">\n'
          curated = text[grid_start + len(grid_head):lab_start]
          suffix = text[lab_start:]

          card_pattern = re.compile(r'\s*<article class="project-card[^\"]*"(?: id="[^\"]+")?>.*?</article>\s*', re.S)
          cards = {}
          for match in card_pattern.finditer(curated):
              card = match.group(0).strip('\n')
              title_match = re.search(r'<h3>(.*?)</h3>', card, re.S)
              if title_match:
                  title = re.sub(r'<.*?>', '', title_match.group(1)).strip()
                  cards[title] = card

          expected = {
              'ChangeProof',
              'ControlSift',
              'IBM i Vulnerability Curator',
              'INQUISITION',
              'GRC Engineering Pipeline',
              'IMPACT!',
          }
          missing = expected - set(cards)
          if missing:
              raise SystemExit(f'Missing project cards: {sorted(missing)}')

          impact = cards['IMPACT!']
          impact = re.sub(
              r'<article class="project-card[^\"]*">',
              '<article class="project-card amber-card reveal" id="impact-project">',
              impact,
              count=1,
          )
          impact = re.sub(
              r'<p class="project-tagline">.*?</p>',
              '<p class="project-tagline">Cyber risk translated into decisions.</p>',
              impact,
              count=1,
              flags=re.S,
          )
          impact = re.sub(
              r'<p>Translates cyber and operational risk.*?</p>',
              '<p>An interactive FAIR-informed decision environment connecting modeled loss exposure, control posture, financial consequence, causal explanation, tail-risk exploration, and executive risk communication across analyst, guided, and board views.</p>',
              impact,
              count=1,
              flags=re.S,
          )
          impact = re.sub(
              r'<p><strong>Problem</strong>.*?</p>',
              '<p><strong>Problem</strong> Quantified cyber risk still fails if analysts, executives, and boards cannot see how technical assumptions become business consequences and decisions.</p>',
              impact,
              count=1,
              flags=re.S,
          )
          impact = re.sub(
              r'<p><strong>Built</strong>.*?</p>',
              '<p><strong>Built</strong> A linked decision environment with scenario modeling, TEF/vulnerability-driven loss frequency, deterministic Monte Carlo tail exploration, causal traces, guided walkthroughs, financial analysis, and a board-level risk memo.</p>',
              impact,
              count=1,
              flags=re.S,
          )
          impact = re.sub(
              r'<p><strong>Inspect</strong>.*?</p>',
              '<p><strong>Inspect</strong> Analyst workspace · tail lens · causal explanation · guided mode · board view · assumptions · public source.</p>',
              impact,
              count=1,
              flags=re.S,
          )
          impact = re.sub(
              r'<ul class="tags">.*?</ul>',
              '<ul class="tags"><li>FAIR</li><li>Financial modeling</li><li>CRQ</li><li>Decision support</li></ul>',
              impact,
              count=1,
              flags=re.S,
          )
          cards['IMPACT!'] = impact

          cards['INQUISITION'] = cards['INQUISITION'].replace(
              'class="project-card amber-card reveal"',
              'class="project-card reveal"',
              1,
          )

          order = [
              ('IMPACT!', '02'),
              ('ChangeProof', '03'),
              ('ControlSift', '04'),
              ('INQUISITION', '05'),
              ('IBM i Vulnerability Curator', '06'),
              ('GRC Engineering Pipeline', '07'),
          ]

          rendered = []
          for title, number in order:
              card = cards[title]
              card = re.sub(
                  r'(<div class="card-top"><span>)\d+(</span>)',
                  rf'\g<1>{number}\g<2>',
                  card,
                  count=1,
              )
              # Keep the portfolio source tidy even though ControlSift predates the current indentation pass.
              lines = card.splitlines()
              if lines and not lines[0].startswith('          '):
                  lines = [('          ' + line if line else line) for line in lines]
                  card = '\n'.join(lines)
              rendered.append(card)

          new_curated = '\n\n'.join(rendered) + '\n\n'
          updated = prefix + grid_head + new_curated + suffix
          path.write_text(updated)
          PY

      - name: Verify promoted ordering and copy
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          expected = [
              '<span>02</span><span>LIVE DECISION TOOL</span>',
              '<span>03</span><span>CHANGE ASSURANCE RUNTIME</span>',
              '<span>04</span><span>AI ASSURANCE RESEARCH</span>',
              '<span>05</span><span>CYBER-LOSS CASEBOOK</span>',
              '<span>06</span><span>IBM i REMEDIATION CURATOR</span>',
              '<span>07</span><span>CONTROL PIPELINE</span>',
          ]
          positions = [text.index(item) for item in expected]
          assert positions == sorted(positions), positions
          assert 'Cyber risk translated into decisions.' in text
          assert 'deterministic Monte Carlo tail exploration' in text
          assert 'board-level risk memo' in text
          assert text.count('class="project-card amber-card reveal"') == 1
          assert 'class="project-card amber-card reveal" id="impact-project"' in text
          PY

      - name: Commit portfolio promotion
        run: |
          if git diff --quiet -- index.html; then
            echo "No portfolio changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote Impact in the portfolio"
          git push origin HEAD:feat/promote-impact
